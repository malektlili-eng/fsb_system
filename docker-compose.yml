# docker-compose.yml
# ═══════════════════════════════════════════════════════════════════
#  FSB System — Stack de développement local
#  Services : Django + PostgreSQL + Redis
#
#  Usage :
#    docker-compose up -d          # Démarrer tous les services
#    docker-compose logs -f web    # Voir les logs Django
#    docker-compose exec web python manage.py shell
# ═══════════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ─── Base de données PostgreSQL ─────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsb_db
      POSTGRES_USER: fsb_user
      POSTGRES_PASSWORD: fsb_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsb_user -d fsb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Django ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder   # Utiliser le stage builder (avec outils dev)
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app              # Hot reload du code source
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://fsb_user:fsb_dev_password@db:5432/fsb_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  media_files:
