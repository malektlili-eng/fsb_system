# render.yaml — Déploiement en un clic sur Render (https://render.com)
# ═══════════════════════════════════════════════════════════════════
# DÉPLOIEMENT EN UN CLIC
#   Bouton « Deploy to Render » du README, ou :
#   render.com → New → Blueprint → sélectionner ce dépôt.
#
# ─── POURQUOI CETTE DÉMO EST « SANS ÉTAT » ─────────────────────────
#
# L'instance de démonstration tourne sur SQLite, reconstruite à chaque
# démarrage par `init_data`. Ce n'est pas un raccourci, c'est une
# décision assumée, pour deux raisons.
#
# 1. DURÉE DE VIE. Une base PostgreSQL gratuite Render expire 30 jours
#    après sa création, puis est supprimée. Un lien de démonstration
#    placé dans une candidature doit rester vivant plusieurs mois : une
#    base à renouveler est un lien mort programmé.
#
# 2. INTÉGRITÉ. Cette démo est publique et l'agent sait écrire en base
#    (créer un étudiant, planifier un examen). Avec un stockage
#    persistant, le premier visiteur qui teste ces fonctions laisse ses
#    traces à tous les suivants. Sans état, la démo se répare seule.
#
# Les écritures faites pendant une session fonctionnent normalement et
# sont visibles ; elles disparaissent à la mise en veille.
#
# ─── REPASSER SUR POSTGRESQL ───────────────────────────────────────
# La configuration PostgreSQL reste la configuration de production :
# `config/settings/production.py` l'utilise dès que DATABASE_URL est
# fournie, et `docker-compose.yml` l'utilise en local. Pour la rétablir
# ici, décommenter le bloc `databases:` ci-dessous ET la variable
# DATABASE_URL dans `envVars`. Aucune modification de code.
# ═══════════════════════════════════════════════════════════════════

# databases:
#   - name: fsb-postgres
#     plan: free            # expire après 30 jours — cf. note ci-dessus
#     databaseName: fsb_db
#     user: fsb_user

services:
  # ─── Application web (Django + Gunicorn) ──────────────────────────
  - type: web
    name: fsb-system
    runtime: python
    plan: free
    # La base est semée À LA CONSTRUCTION : les fichiers produits ici
    # font partie de l'image déployée et survivent donc aux redémarrages,
    # contrairement aux écritures faites à l'exécution.
    buildCommand: >-
      pip install -r requirements/production.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --no-input &&
      python manage.py init_data --quiet &&
      python manage.py build_rag_index
    # Filet de sécurité : si le conteneur redémarre sans son système de
    # fichiers, migrate et init_data (idempotents) reconstruisent la base
    # avant que Gunicorn n'accepte la première requête. Quelques secondes,
    # mais jamais de page de connexion sur une base vide.
    startCommand: >-
      python manage.py migrate --no-input &&
      python manage.py init_data --quiet &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Décommenter avec le bloc `databases:` pour repasser sur PostgreSQL.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: fsb-postgres
      #     property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fsb-redis
          property: connectionString
      # Clé LLM facultative : sans elle, LLM_FALLBACK_OFFLINE sert le
      # fournisseur déterministe et la démo reste utilisable.
      - key: GROQ_API_KEY
        sync: false
      # Catalogue Groq mouvant : llama-3.3-70b-versatile est passé en
      # offre Enterprise (août 2026) et renvoie 404 sur une clé gratuite.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FALLBACK_OFFLINE
        value: "True"
      # Mot de passe PUBLIC et volontairement lisible : cette instance
      # ne contient que des données fictives, et un examinateur qui ne
      # peut pas se connecter ne voit rien. Il est publié dans le README.
      - key: DEMO_ADMIN_PASSWORD
        value: demo-fsb-2026
      - key: RAG_EMBEDDING_BACKEND
        value: tfidf
      - key: PYTHON_VERSION
        value: "3.12"

  # ─── Cache (Render Key Value, compatible Redis) ───────────────────
  - type: redis
    name: fsb-redis
    plan: free
    ipAllowList: []
